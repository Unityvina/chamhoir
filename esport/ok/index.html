<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniData - Trung Tâm Giải Mã & Tra Cứu</title>
    <!-- Tải thư viện mã hóa bảo mật CryptoJS để giải mã tại client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        :root {
            --sidebar-width: 340px; --bg-darker: #0d1117; --bg-panel: #161b22;
            --bg-body: #010409; --color-teal: #58a6ff; --text-main: #c9d1d9;
            --text-muted: #8b949e; --border-dark: #30363d; --color-danger: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        
        .sidebar { width: var(--sidebar-width); background-color: var(--bg-darker); border-right: 1px solid var(--border-dark); display: flex; flex-direction: column; height: 100%; }
        .brand-zone { padding: 20px; border-bottom: 1px solid var(--border-dark); }
        .user-profile { padding: 15px 20px; background-color: #161b22; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
        .search-box { padding: 15px 20px; }
        .input-text { width: 100%; padding: 10px; background-color: var(--bg-body); border: 1px solid var(--border-dark); border-radius: 6px; color: #fff; font-size: 13px; }
        
        .data-list-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .data-card { background-color: var(--bg-panel); border: 1px solid var(--border-dark); padding: 12px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
        .data-card.active { border-color: var(--color-teal); background-color: #1f2937; }
        .card-title { font-weight: bold; font-size: 14px; color: #fff; }
        .counter-group { display: flex; gap: 6px; font-size: 10px; margin-top: 8px; }
        .badge { padding: 2px 6px; border-radius: 4px; background-color: rgba(88, 166, 255, 0.15); color: var(--color-teal); }

        .workspace { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .view-port { flex: 1; padding: 40px; overflow-y: auto; }
        .viewer-container { background-color: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 8px; padding: 30px; }
        .viewer-title { font-size: 22px; color: #fff; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-dark); }
        .viewer-content { white-space: pre-wrap; font-family: monospace; font-size: 14px; color: #e6edf3; background: #010409; padding: 15px; border-radius: 6px; border: 1px solid var(--border-dark); }
        
        button { padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        .btn-teal { background-color: var(--color-teal); color: #0d1117; }
        .btn-danger { background-color: transparent; color: var(--color-danger); border: 1px solid rgba(248,81,73,0.3); }
        .btn-danger:hover { background-color: var(--color-danger); color: #fff; }
        
        .center-notice { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- SIDEBAR LEFT -->
    <aside class="sidebar">
        <div class="brand-zone"><h3>Bộ Phận Giải Mã & Tìm Kiếm 🔍</h3></div>
        
        <div id="auth-block" style="padding: 20px;">
            <button class="btn-teal" id="btn-login" style="width:100%;">Đăng Nhập Mail Để Xem</button>
        </div>

        <div id="user-block" class="user-profile hidden">
            <div>
                <b id="user-name" style="color: #fff;"></b>
                <div id="user-email" style="color: var(--text-muted);"></div>
            </div>
            <button id="btn-logout" style="padding:4px 8px; font-size:11px; background:#21262d; color:#fff; border:1px solid var(--border-dark);">Thoát</button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" class="input-text" placeholder="Tìm kiếm nhanh trên dữ liệu sạch...">
        </div>

        <div class="data-list-scroll" id="data-list-container"></div>
    </aside>

    <!-- WORKSPACE RIGHT -->
    <main class="workspace">
        <div class="view-port">
            <div id="view-lock" class="center-notice">
                <h2>Không gian đang khóa</h2>
                <p>Hãy đăng nhập đúng tài khoản Google để thực hiện giải mã dữ liệu của riêng bạn.</p>
            </div>

            <div id="view-empty" class="center-notice hidden">
                <h2>Không có dữ liệu</h2>
                <p>Kho dữ liệu của bạn chưa chứa bản ghi nào được giải mã thành công.</p>
            </div>

            <div id="view-reader" class="viewer-container hidden">
                <h2 id="render-title" class="viewer-title"></h2>
                <div style="font-size:12px; margin-bottom: 10px; color:#2ea44f">🔓 Dữ liệu đã được giải mã AES an toàn tại trình duyệt của bạn</div>
                <pre id="render-body" class="viewer-content"></pre>
                <div style="margin-top:20px; text-align:right;">
                    <button class="btn-danger" id="btn-delete">Xóa Dữ Liệu Khỏi Server</button>
                </div>
            </div>
        </div>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, deleteDoc, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcHZ1RIALvsXC7iRey5y-8ek-j8bFP82U",
      authDomain: "proxyinternetcave.firebaseapp.com",
      projectId: "proxyinternetcave",
      storageBucket: "proxyinternetcave.firebasestorage.app",
      messagingSenderId: "811924386251",
      appId: "1:811924386251:web:7ba435fe9c4fb268de464e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let userSession = null;
    let encryptedCache = []; // Bộ nhớ đệm giữ thông tin gốc mã hóa
    let decryptedCache = []; // Bộ nhớ đệm giữ thông tin đã được giải mã hoàn chỉnh để tìm kiếm cực nhanh
    let viewCounter = {}; 
    let selectedId = null;
    let snapshotListener = null;

    document.getElementById('btn-login').addEventListener('click', () => signInWithPopup(auth, provider));
    document.getElementById('btn-logout').addEventListener('click', () => {
        if(snapshotListener) snapshotListener();
        signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            userSession = user;
            document.getElementById('auth-block').classList.add('hidden');
            document.getElementById('user-block').classList.remove('hidden');
            document.getElementById('view-lock').classList.add('hidden');
            document.getElementById('user-name').textContent = user.displayName;
            document.getElementById('user-email').textContent = user.email;
            
            startSyncAndDecrypt(user.uid);
        } else {
            userSession = null;
            document.getElementById('auth-block').classList.remove('hidden');
            document.getElementById('user-block').classList.add('hidden');
            document.getElementById('view-lock').classList.remove('hidden');
            document.getElementById('view-reader').classList.add('hidden');
            document.getElementById('view-empty').classList.add('hidden');
            document.getElementById('data-list-container').innerHTML = '';
        }
    });

    // Luồng đồng bộ Database kết hợp Giải Mã thời gian thực
    function startSyncAndDecrypt(uid) {
        const storageRef = collection(db, "users", uid, "dataStorage");
        const q = query(storageRef, orderBy("timestamp", "desc"));

        snapshotListener = onSnapshot(q, (snapshot) => {
            encryptedCache = [];
            decryptedCache = [];
            
            if(snapshot.empty) {
                document.getElementById('data-list-container').innerHTML = '';
                document.getElementById('view-reader').classList.add('hidden');
                document.getElementById('view-empty').classList.remove('hidden');
                return;
            }
            document.getElementById('view-empty').classList.add('hidden');

            snapshot.forEach((doc) => {
                const data = doc.data();
                encryptedCache.push({ id: doc.id, ...data });

                // Thực thi Giải Mã Cục Bộ bằng Khóa Bí Mật là UID cá nhân
                let plainText = "[Lỗi giải mã]";
                try {
                    if (data.content) {
                        const bytes = CryptoJS.AES.decrypt(data.content, uid);
                        plainText = bytes.toString(CryptoJS.enc.Utf8) || "[Chuỗi trống/Sai Khóa]";
                    }
                } catch (e) {
                    console.error("Không thể giải mã bản ghi: ", doc.id);
                }

                decryptedCache.push({
                    id: doc.id,
                    content: plainText,
                    updateCount: data.updateCount || 1
                });
            });

            renderListUI(decryptedCache);

            // Giữ trạng thái hiển thị của item đang chọn
            if (selectedId) {
                const activeItem = decryptedCache.find(i => i.id === selectedId);
                if (activeItem) showContent(activeItem);
            } else {
                selectedId = decryptedCache[0].id;
                showContent(decryptedCache[0]);
            }
        });
    }

    // Hiển thị danh sách và xử lý cấu hình bộ đếm xem cục bộ (View count)
    function renderListUI(items) {
        const container = document.getElementById('data-list-container');
        container.innerHTML = '';

        items.forEach(item => {
            if(!viewCounter[item.id]) viewCounter[item.id] = 0;
            const card = document.createElement('div');
            card.className = `data-card ${selectedId === item.id ? 'active' : ''}`;
            card.innerHTML = `
                <div class="card-title">${item.id}</div>
                <div class="counter-group">
                    <span class="badge">Sửa: ${item.updateCount} lần</span>
                    <span class="badge" style="background:rgba(56,189,248,0.15); color:#38bdf8;">Xem: ${viewCounter[item.id]}</span>
                </div>
            `;

            card.addEventListener('click', () => {
                selectedId = item.id;
                viewCounter[item.id] += 1; // Bộ đếm tăng an toàn không tốn băng thông ghi mạng
                document.querySelectorAll('.data-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                showContent(item);
            });
            container.appendChild(card);
        });
    }

    function showContent(item) {
        document.getElementById('view-reader').classList.remove('hidden');
        document.getElementById('render-title').textContent = item.id;
        document.getElementById('render-body').textContent = item.content;
    }

    // TÌM KIẾM TOÀN VĂN SIÊU TỐC: Tìm trực tiếp trên vùng nhớ cache dữ liệu SẠCH (đã được giải mã)
    document.getElementById('search-input').addEventListener('input', (e) => {
        const queryStr = e.target.value.toLowerCase().trim();
        const filtered = decryptedCache.filter(item => 
            item.id.toLowerCase().includes(queryStr) || 
            item.content.toLowerCase().includes(queryStr)
        );
        renderListUI(filtered);
    });

    // Chức năng xóa bản ghi
    document.getElementById('btn-delete').addEventListener('click', async () => {
        if (!selectedId || !userSession) return;
        if (confirm(`Bạn chắc chắn muốn xóa bản ghi "${selectedId}" trên Server chứ?`)) {
            try {
                const docRef = doc(db, "users", userSession.uid, "dataStorage", selectedId);
                await deleteDoc(docRef);
                delete viewCounter[selectedId];
                selectedId = null;
                alert("Đã xóa thành công.");
            } catch (error) {
                alert("Lỗi khi thực hiện xóa: " + error.message);
            }
        }
    });
</script>
</body>
</html>
