<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniData - Bộ Phận Lưu Trữ Mã Hóa</title>
    <!-- Tải thư viện mã hóa bảo mật CryptoJS mã hóa dữ liệu tại client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-body: #010409; --bg-panel: #161b22; --border-dark: #30363d;
            --color-teal: #58a6ff; --text-main: #c9d1d9; --text-muted: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 8px; padding: 30px; width: 100%; max-width: 650px; }
        h2 { margin-bottom: 20px; color: #fff; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { font-size: 13px; color: var(--text-muted); text-align: right; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 600; }
        .input-text, .main-editor { width: 100%; padding: 12px; background-color: var(--bg-body); border: 1px solid var(--border-dark); border-radius: 6px; color: #fff; font-size: 14px; }
        .input-text:focus, .main-editor:focus { outline: 1px solid var(--color-teal); }
        .main-editor { height: 250px; font-family: monospace; resize: none; }
        button { width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; }
        .btn-teal { background-color: var(--color-teal); color: #0d1117; }
        .btn-teal:hover { opacity: 0.9; }
        .btn-sec { background-color: #21262d; border: 1px solid var(--border-dark); color: var(--text-main); margin-bottom: 15px; }
        .hidden { display: none !important; }
        .nav-link { display: block; text-align: center; margin-top: 15px; color: var(--color-teal); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- KHỐI XÁC THỰC -->
        <div id="auth-block">
            <h2 style="text-align: center; justify-content: center; margin-bottom: 30px;">OmniData - Cổng Lưu Trữ 🔐</h2>
            <button class="btn-teal" id="btn-login">Đăng nhập bằng Google Mail để mã hóa dữ liệu</button>
        </div>

        <!-- KHỐI FORM LƯU TRỮ -->
        <div id="form-block" class="hidden">
            <h2>
                <span>Nhập Dữ Liệu Thô</span>
                <span id="user-display" class="user-info"></span>
            </h2>
            
            <button class="btn-sec" id="btn-logout">Đăng xuất tài khoản</button>

            <div class="form-group">
                <label for="input-title">Tiêu đề / Danh mục phân loại (Để thô)</label>
                <input type="text" id="input-title" class="input-text" placeholder="Ví dụ: MatKhauFacebook, Config_Server_01...">
            </div>

            <div class="form-group">
                <label for="input-content">Nội dung dữ liệu (Sẽ mã hóa tự động trước khi gửi)</label>
                <textarea id="input-content" class="main-editor" placeholder="Dán bất kỳ thông tin nhạy cảm nào vào đây (mã code, tài khoản, tệp...)."></textarea>
            </div>

            <button class="btn-teal" id="btn-save">Mã hóa & Lưu Lên Database 🚀</button>
            
            <a href="display.html" target="_blank" class="nav-link">Đi đến trang hiển thị & tìm kiếm dữ liệu →</a>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcHZ1RIALvsXC7iRey5y-8ek-j8bFP82U",
      authDomain: "proxyinternetcave.firebaseapp.com",
      projectId: "proxyinternetcave",
      storageBucket: "proxyinternetcave.firebasestorage.app",
      messagingSenderId: "811924386251",
      appId: "1:811924386251:web:7ba435fe9c4fb268de464e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let userSession = null;

    // Quản lý Đăng nhập / Đăng xuất
    document.getElementById('btn-login').addEventListener('click', () => signInWithPopup(auth, provider));
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            userSession = user;
            document.getElementById('auth-block').classList.add('hidden');
            document.getElementById('form-block').classList.remove('hidden');
            document.getElementById('user-display').innerHTML = `${user.displayName}<br>${user.email}`;
        } else {
            userSession = null;
            document.getElementById('auth-block').classList.remove('hidden');
            document.getElementById('form-block').classList.add('hidden');
        }
    });

    // Hàm thực thi Luồng Mã hóa và đẩy lên Database
    document.getElementById('btn-save').addEventListener('click', async () => {
        const title = document.getElementById('input-title').value.trim();
        const content = document.getElementById('input-content').value;

        if (!title || !content.trim()) {
            alert("Không được để trống thông tin dữ liệu!");
            return;
        }

        try {
            // Bước quan trọng: Tiến hành mã hóa AES cục bộ sử dụng UID làm chìa khóa bí mật
            const secretKey = userSession.uid;
            const encryptedContent = CryptoJS.AES.encrypt(content, secretKey).toString();

            // Đẩy dữ liệu đã mã hóa lên Firestore theo cấu trúc cô lập email khách
            const docRef = doc(db, "users", userSession.uid, "dataStorage", title);
            await setDoc(docRef, {
                content: encryptedContent, // Firebase chỉ thấy đống ký tự lộn xộn này
                isEncrypted: true,
                updateCount: increment(1),
                timestamp: new Date()
            }, { merge: true });

            alert("Đã mã hóa đầu cuối và đồng bộ thành công!");
            document.getElementById('input-title').value = '';
            document.getElementById('input-content').value = '';
        } catch (error) {
            alert("Lỗi lưu trữ dữ liệu mã hóa: " + error.message);
        }
    });
</script>
</body>
</html>
